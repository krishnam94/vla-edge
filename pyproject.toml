[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vla-edge"
dynamic = ["version"]
description = "Profile, optimize, validate, and deploy VLA models to edge hardware"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Krishnam Gupta", email = "kayjee1994@gmail.com" },
]
keywords = ["robotics", "vla", "edge", "jetson", "deployment", "profiling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<3.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
pytorch = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]
gguf = [
    "llama-cpp-python>=0.3",
]
tensorrt = [
    "torch-tensorrt>=2.2",
]
safety = [
    "vla-edge[pytorch]",
]
jetson = [
    "vla-edge[pytorch,gguf]",
    "jetson-stats>=4.0",
]
cuda = [
    "vla-edge[pytorch]",
]
smolvla = [
    "vla-edge[pytorch]",
    "lerobot>=0.2.0",
]
all = [
    "vla-edge[pytorch,gguf,safety,tensorrt,smolvla]",
]
dev = [
    "vla-edge[pytorch]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
vla-edge = "vla_edge.cli:app"

[project.urls]
Homepage = "https://github.com/krishnam94/vla-edge"
Documentation = "https://github.com/krishnam94/vla-edge#readme"
Repository = "https://github.com/krishnam94/vla-edge"
Issues = "https://github.com/krishnam94/vla-edge/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/vla_edge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_edge"]

# -- Ruff --
[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]
exclude = ["src/vla_edge/_version.py"]  # Auto-generated by hatch-vcs

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "N", "RUF"]
ignore = ["E501", "B008"]  # B008: Typer requires function calls in defaults

[tool.ruff.lint.isort]
known-first-party = ["vla_edge"]

# -- Mypy --
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "vla_edge.backends.*"
ignore_errors = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "vla_edge.models.*"
ignore_errors = false
disallow_untyped_defs = false  # SmolVLA has Any types due to lazy loading

# -- Pytest --
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cpu: runs on CPU only",
    "gpu: requires CUDA GPU",
    "jetson: requires Jetson hardware",
    "tensorrt: requires TensorRT",
    "slow: takes >60 seconds",
    "integration: end-to-end integration test",
]
addopts = "-m 'not gpu and not jetson and not slow' --timeout=30 -v"

# -- Coverage --
[tool.coverage.run]
source = ["vla_edge"]

[tool.coverage.report]
show_missing = true
fail_under = 50  # Will raise as we add more testable modules
