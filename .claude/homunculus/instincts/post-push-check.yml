name: pre-push-and-post-push
description: Critic BEFORE push, checklist AFTER push
trigger: before and after running git push
rule: |
  BEFORE pushing (mandatory):
  1. Run /critic on changed files. Do NOT skip this.
     Exception: doc-only or config-only changes (no src/ changes).
  2. Fix any HIGH severity findings before pushing.

  AFTER pushing (2 minutes):
  3. Did CI pass? Run: gh run list --repo krishnam94/vla-edge --limit 1
  4. Did I update LEARNING.md? (if new concept was implemented)
  5. Did I close relevant GitHub issues in the commit message? (closes #N)
  6. Any lesson learned worth adding to META_ENGINEERING.md?

  Batching rule: if you have 2+ commits ready to push, run critic
  ONCE on all changed files, not per-commit. Then push all together.
